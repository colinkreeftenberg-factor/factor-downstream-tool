<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FACTOR_EU — Internal Ops Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon: #141414;
    --natural: #F1F1EA;
    --natural-2: #E7E6DC;
    --saffron: #FFC800;
    --line: #D9D7C9;
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--natural);
    color: var(--carbon);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HERO ── */
  .hero { background: var(--carbon); padding: 28px 32px; }
  .hero-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: center;
  }
  .hero-logo {
    width: 34px; height: 34px;
    border-radius: 8px; overflow: hidden; margin-bottom: 14px;
  }
  .hero-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .hero-eyebrow {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase;
    color: #6a6958; margin-bottom: 8px;
  }
  .hero-title {
    font-size: 44px; font-weight: 800; letter-spacing: -0.025em;
    color: var(--natural); margin: 0; line-height: 1;
    border-bottom: 4px solid var(--saffron);
    display: inline-block; padding-bottom: 6px;
  }
  .hero-sub {
    font-size: 13.5px; font-weight: 500; color: #6a6958; margin-top: 10px;
  }
  .hero-photo {
    width: 230px; height: 164px;
    border-radius: 14px; overflow: hidden; flex-shrink: 0;
  }
  .hero-photo img { width: 100%; height: 100%; display: block; object-fit: cover; }

  @media (max-width: 700px) {
    .hero-inner { grid-template-columns: 1fr; }
    .hero-photo { display: none; }
    .hero-title { font-size: 34px; }
  }

  /* ── LAYOUT ── */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 26px 32px 48px; }

  /* ── 2-COLUMN GRID for sections ── */
  .sections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 28px;
    align-items: start;
  }
  @media (max-width: 700px) { .sections-grid { grid-template-columns: 1fr; } }

  /* ── CATEGORY HEADER ── */
  .cat-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
  }
  .cat-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #9a998f; white-space: nowrap;
  }
  .cat-rule { flex: 1; height: 1px; background: var(--line); }

  /* ── TOOL LIST (button panel) ── */
  .tool-list {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBFBF7;
    overflow: hidden;
  }

  /* ── TOOL ROW ── */
  .tool-row {
    display: flex;
    align-items: center;
    padding: 10px 13px;
    min-height: 44px;
    text-decoration: none;
    color: var(--carbon);
    gap: 10px;
    transition: background 0.12s;
  }
  .tool-row:not(:last-child) { border-bottom: 1px solid var(--line); }
  .tool-row:hover { background: rgba(20,20,20,0.042); }
  .tool-row:hover .row-arrow { color: var(--carbon); transform: translateX(2px); }

  .row-name {
    font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em;
    flex: 1; min-width: 0; line-height: 1.3;
  }
  .row-tags {
    display: flex; gap: 4px; flex-wrap: wrap;
    justify-content: flex-end; flex-shrink: 0;
  }
  .row-arrow {
    font-size: 12px; color: #c9c7ba; flex-shrink: 0;
    transition: color 0.12s, transform 0.12s;
  }

  /* ── TAGS — every market its own color ── */
  .tag {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px; font-weight: 600; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap;
  }
  /* NL  — Ocean teal   */
  .tag-NL     { background:rgba(24,132,159,.12);  border-color:rgba(24,132,159,.4);  color:#0b5e74; }
  /* BE  — Pistachio    */
  .tag-BE     { background:rgba(117,194,109,.13); border-color:rgba(117,194,109,.45);color:#1b5c16; }
  /* FR-BE — Watermelon */
  .tag-FR-BE  { background:rgba(255,88,93,.1);    border-color:rgba(255,88,93,.38);  color:#bf2b2e; }
  /* SE  — Sky          */
  .tag-SE     { background:rgba(97,223,255,.15);  border-color:rgba(97,223,255,.52); color:#1a7a96; }
  /* DK  — Cherry       */
  .tag-DK     { background:rgba(155,38,41,.1);    border-color:rgba(155,38,41,.35);  color:#7a1f22; }
  /* DE  — Dijon gold   */
  .tag-DE     { background:rgba(199,156,0,.12);   border-color:rgba(199,156,0,.42);  color:#7a5e00; }
  /* All Markets — Saffron */
  .tag-All    { background:rgba(255,200,0,.14);   border-color:rgba(255,200,0,.5);   color:#7a5f00; }

  /* ── RESOURCES ── */
  .resources {
    margin-top: 28px; padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .res-toggle {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .res-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #b8b7a8; white-space: nowrap;
  }
  .res-rule { flex: 1; height: 1px; background: var(--line); }
  .res-chevron { font-size: 9px; color: #b8b7a8; transition: transform 0.2s; }
  .res-chevron.open { transform: rotate(180deg); }
  .res-body { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; }
  .res-pill {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10.5px; color: #8a897d; text-decoration: none;
    padding: 4px 11px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--natural-2);
    transition: border-color 0.15s, color 0.15s;
  }
  .res-pill:hover { border-color: #8a897d; color: var(--carbon); }

  /* ── FOOTER ── */
  footer {
    margin-top: 26px; padding-top: 14px;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10.5px; color: #b8b7a8;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-logo"><img src="assets/logo.png" alt="Factor" /></div>
      <div class="hero-eyebrow">Internal Ops Tooling</div>
      <h1 class="hero-title">FACTOR_EU</h1>
      <div class="hero-sub">Swap, Shortage &amp; Middle Mile Applications</div>
    </div>
    <div class="hero-photo"><img src="assets/hero.png" alt="" /></div>
  </div>
</div>

<main class="wrap">
  <div class="sections-grid" id="toolSections"></div>

  <div class="resources">
    <div class="res-toggle" onclick="toggleRes()">
      <span class="res-label">References &amp; Archives</span>
      <span class="res-rule"></span>
      <span class="res-chevron" id="chevron">▾</span>
    </div>
    <div class="res-body" id="resBody" style="display:none"></div>
  </div>

  <footer>Factor · internal tools · built &amp; maintained by <strong>Colin Kreeftenberg</strong></footer>
</main>

<script>

/* ── Active tools ── */
const TOOLS = [
  {
    name: "De Kas — Proactive Swap & Shortage Manager",
    href: "tools/swap-shortage-manager.html",
    tags: ["NL","BE"],
    category: "Strategic Swapping — Box Files",
  },
  {
    name: "Verden — Proactive Swap & Shortage Manager",
    href: "tools/swap_shortage_manager_verden_3.html",
    tags: ["SE","DK","DE"],
    category: "Strategic Swapping — Box Files",
  },
  {
    name: "De Kas — Swap & Shorts",
    href: "tools/bnl-swaps-after-production.html",
    tags: ["NL","BE","FR-BE"],
    category: "Downstream Communications & Compensation",
  },
  {
    name: "Verden — Swap & Shorts",
    href: "tools/verden-swap-short-builder.html",
    tags: ["DE","SE","DK"],
    category: "Downstream Communications & Compensation",
  },
  {
    name: "Downstream — Communication Creator",
    href: "tools/comms-creator.html",
    tags: ["All Markets"],
    category: "Downstream Communications & Compensation",
  },
  {
    name: "Lane Manager",
    href: "https://lane-manager-factor-eu.vercel.app/",
    tags: ["All Markets"],
    category: "Middle Mile Management",
  },
  {
    name: "Error Reporting",
    href: "https://reporting-factor-eu.vercel.app/",
    tags: ["All Markets"],
    category: "Reporting",
  },
];

/* ── Reference / archive links ── */
const RESOURCES = [
  { name: "Swap & Shortage CRM Guide", href: "https://hellofresh.atlassian.net/wiki/spaces/EUF/pages/6760202365/Swap+Shortage+Tools+User+Guide+BNL+DE-SE-DK" },
  { name: "Backend Sheet", href: "https://docs.google.com/spreadsheets/d/1DjYDHfwKLRkQzlEj22whxrBjdk9T36VRQqMGE91l17U/edit?gid=0#gid=0" },
  { name: "Bulk Export Builder (archived)", href: "tools/factor_compensation_export_builder_3.html" },
  { name: "CRM Export Builder (archived)", href: "tools/de-se-dk-tool.html" },
];

function tagHtml(tag) {
  /* Use the first word of "All Markets" as class key */
  const cls = tag === "All Markets" ? "All" : tag.replace("-","\\-");
  return `<span class="tag tag-${tag === "All Markets" ? "All" : tag}">${tag}</span>`;
}

function render() {
  const groups = {};
  TOOLS.forEach(t => {
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });

  document.getElementById('toolSections').innerHTML =
    Object.entries(groups).map(([cat, tools]) => `
      <div>
        <div class="cat-header">
          <span class="cat-label">${cat}</span>
          <span class="cat-rule"></span>
        </div>
        <div class="tool-list">
          ${tools.map(t => `
            <a class="tool-row"
               href="${t.href}"
               target="${t.href.startsWith('http') ? '_blank' : '_self'}"
               rel="noopener">
              <span class="row-name">${t.name}</span>
              <span class="row-tags">${t.tags.map(tagHtml).join('')}</span>
              <span class="row-arrow">→</span>
            </a>
          `).join('')}
        </div>
      </div>
    `).join('');

  document.getElementById('resBody').innerHTML =
    RESOURCES.map(r =>
      `<a class="res-pill" href="${r.href}" target="_blank" rel="noopener">${r.name}</a>`
    ).join('');
}

function toggleRes() {
  const body = document.getElementById('resBody');
  const chev = document.getElementById('chevron');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'flex';
  chev.classList.toggle('open', !open);
}

render();
</script>
</body>
</html>
